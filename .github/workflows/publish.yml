name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release source and version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Pack npm distribution
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - name: Build optional Agensi distributions
        if: hashFiles('tools/build_agensi.py') != ''
        run: python3 tools/build_agensi.py --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, package]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: dist
      - name: Check immutable npm version
        id: registry
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          const tarballs = fs.readdirSync('dist').filter(f => f.endsWith('.tgz'));
          if (tarballs.length !== 1) throw new Error('Expected exactly one verified npm tarball');
          const integrity = 'sha512-' + crypto.createHash('sha512').update(fs.readFileSync('dist/' + tarballs[0])).digest('base64');
          const response = await fetch('https://registry.npmjs.org/' + encodeURIComponent(pkg.name) + '/' + pkg.version);
          if (![200, 404].includes(response.status)) throw new Error('Registry check failed: ' + response.status);
          if (response.ok && (await response.json()).dist.integrity !== integrity) throw new Error('Published version has different bytes; increment the version');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'published=' + response.ok + '\n');
          JS
      - name: Publish verified tarball with npm OIDC
        if: steps.registry.outputs.published != 'true'
        run: npm publish dist/*.tgz --access public --provenance
      - name: Attach distributions to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
